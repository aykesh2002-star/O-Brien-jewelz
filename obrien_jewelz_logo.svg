<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d98a"/>
      <stop offset="45%" stop-color="#caa646"/>
      <stop offset="100%" stop-color="#8a6a1f"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#caa646" stop-opacity="0"/>
      <stop offset="50%" stop-color="#caa646" stop-opacity="1"/>
      <stop offset="100%" stop-color="#caa646" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="600" height="320" fill="#0d0d0d"/>

  <!-- Gem icon -->
  <g transform="translate(300,95)">
    <polygon points="0,-42 34,-8 0,60 -34,-8" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <polygon points="-34,-8 34,-8 20,-8 -20,-8" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <polygon points="0,-42 -18,-8 0,60" fill="url(#gold)" fill-opacity="0.12"/>
    <polygon points="0,-42 18,-8 0,60" fill="url(#gold)" fill-opacity="0.22"/>
    <line x1="-34" y1="-8" x2="0" y2="-42" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="34" y1="-8" x2="0" y2="-42" stroke="url(#gold)" stroke-width="1.5"/>
    <line x1="-18" y1="-8" x2="0" y2="60" stroke="url(#gold)" stroke-width="1"/>
    <line x1="18" y1="-8" x2="0" y2="60" stroke="url(#gold)" stroke-width="1"/>
  </g>

  <!-- Wordmark -->
  <text x="300" y="215" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="56" letter-spacing="10" fill="url(#gold)">O'BRIEN</text>

  <!-- divider -->
  <rect x="150" y="238" width="300" height="1.5" fill="url(#goldLine)"/>

  <!-- subtitle -->
  <text x="300" y="270" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="9" fill="#caa646">JEWELZ</text>
</svg>
